name: Daily Tech & AI Newsletter

on:
  schedule:
    - cron: "0 8 * * *"   # Every day at 08:00 UTC
  workflow_dispatch:
    inputs:
      send_only:
        description: "Skip news fetch/generation and just send existing markdown"
        type: boolean
        default: false

permissions:
  contents: write           # Needed to commit the daily news file

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news & send email
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
          SEND_ONLY:          ${{ inputs.send_only }}
        run: python scripts/fetch_news.py

      - name: Commit daily news file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          git diff --staged --quiet || \
            git commit -m "📰 Daily news: $(date -u '+%Y-%m-%d')"
          git push
